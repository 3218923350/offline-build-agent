version: '3.8'

services:
  offline-build-api:
    build: .
    container_name: offline-build-agent
    privileged: true  # 需要特权模式以创建网络命名空间
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-exp}
      - WORK_DIR=/app/workspace
      - OUTPUT_DIR=/app/output
      - MAX_DEBATE_ROUNDS=${MAX_DEBATE_ROUNDS:-10}
      - MAX_EXECUTION_ATTEMPTS=${MAX_EXECUTION_ATTEMPTS:-10}
    volumes:
      - ./output:/app/output
      - ./workspace:/app/workspace
    restart: unless-stopped
    command: >
      bash -c "
      ip netns add offline || true &&
      python -m uvicorn offline_builder.api:app --host 0.0.0.0 --port 8000
      "

